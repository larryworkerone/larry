<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Larry 探针 · 服务器监控</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --panel2: #1c2230;
    --border: #2a3340;
    --text: #c9d1d9;
    --muted: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
    --red: #f85149;
    --amber: #d29922;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, #161b22 0%, #0d1117 100%);
  }
  header h1 { margin: 0; font-size: 20px; font-weight: 600; }
  header .logo {
    width: 28px; height: 28px;
    background: var(--accent);
    border-radius: 8px;
    display: grid; place-items: center;
    color: #0d1117; font-weight: 800; font-size: 16px;
  }
  header .meta { color: var(--muted); font-size: 13px; margin-left: auto; display: flex; align-items: center; gap: 12px; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; background: var(--panel2); color: var(--muted); }
  .btn {
    background: var(--panel2); border: 1px solid var(--border); color: var(--text);
    padding: 5px 12px; border-radius: 6px; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
    transition: all .2s ease;
  }
  .btn:hover { background: var(--border); color: #fff; }
  .btn.primary { background: var(--accent); color: #0d1117; font-weight: 600; border-color: var(--accent); }
  .btn.primary:hover { opacity: .9; }
  .btn.danger { background: rgba(248, 81, 73, 0.15); color: var(--red); border-color: rgba(248, 81, 73, 0.4); }
  .btn.danger:hover { background: var(--red); color: #fff; }
  main { padding: 24px; max-width: 1400px; margin: 0 auto; }
  section { margin-bottom: 32px; }
  section h2 { font-size: 15px; font-weight: 600; color: var(--muted); margin: 0 0 12px; text-transform: uppercase; letter-spacing: .5px; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; background: var(--panel2); position: sticky; top: 0; }
  tr:last-child td { border-bottom: none; }
  tr.offline td { opacity: .5; }
  .bar { position: relative; height: 6px; width: 60px; background: var(--border); border-radius: 3px; overflow: hidden; display: inline-block; vertical-align: middle; }
  .bar > i { display: block; height: 100%; background: var(--green); border-radius: 3px; }
  .bar.warn > i { background: var(--amber); }
  .bar.crit > i { background: var(--red); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--green); margin-right: 6px; vertical-align: middle; }
  .dot.off { background: var(--red); }
  /* mesh heatmap */
  .mesh-wrap { overflow-x: auto; }
  table.mesh { border-collapse: separate; border-spacing: 2px; }
  table.mesh th, table.mesh td { padding: 0; text-align: center; }
  table.mesh .cell {
    width: 46px; height: 28px; line-height: 28px; font-size: 11px; border-radius: 4px;
    background: var(--panel2); color: var(--text);
  }
  table.mesh .self { background: var(--border); color: var(--muted); }
  table.mesh .na { background: var(--panel2); color: var(--muted); }
  table.mesh .lbl { color: var(--muted); font-size: 11px; height: 28px; line-height: 28px; padding: 0 8px; max-width: 120px; overflow: hidden; text-overflow: ellipsis; }
  .empty { color: var(--muted); padding: 32px; text-align: center; }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 24px; border-top: 1px solid var(--border); }
  a { color: var(--accent); text-decoration: none; }

  /* Modal Dialog */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center; z-index: 1000; opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: auto; }
  .modal {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px; width: 90%; max-width: 520px;
    padding: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.5);
  }
  .modal h3 { margin: 0 0 16px; font-size: 18px; display: flex; justify-content: space-between; align-items: center; }
  .modal .close { cursor: pointer; color: var(--muted); font-size: 20px; line-height: 1; }
  .modal .close:hover { color: var(--text); }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .input {
    width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px;
    color: var(--text); font-size: 14px; outline: none;
  }
  .input:focus { border-color: var(--accent); }
  .code-block {
    background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 12px;
    font-family: monospace; font-size: 12px; word-break: break-all; color: var(--accent); position: relative;
    margin-top: 8px;
  }
  .token-table { width: 100%; font-size: 13px; }
  .token-table td { padding: 8px 4px; }
</style>
</head>
<body>
<header>
  <div class="logo">L</div>
  <h1>Larry 探针</h1>
  <span class="pill" id="onlinePill">在线 0 / 0</span>
  <div class="meta">
    <button class="btn primary" id="btnAddNode">+ 添加节点</button>
    <button class="btn" id="btnManage">⚙️ 节点管理</button>
    <span id="updated">—</span>
  </div>
</header>
<main>
  <section>
    <h2>服务器</h2>
    <table id="servers">
      <thead><tr>
        <th>状态</th><th>名称</th><th>系统</th><th>CPU</th><th>内存</th><th>磁盘</th>
        <th>网络 ↓↑</th><th>负载</th><th>连接</th><th>进程</th><th>运行时长</th>
      </tr></thead>
      <tbody id="serverBody"><tr><td colspan="11" class="empty">等待 Agent 连接…</td></tr></tbody>
    </table>
  </section>
  <section id="meshSection">
    <h2>节点互联延迟网格 <span class="pill" id="meshHint">— 两两 TCP 探测延迟 (ms)</span></h2>
    <div class="mesh-wrap">
      <table class="mesh" id="mesh"><tbody id="meshBody">
        <tr><td class="empty">至少需要 2 个在线 Agent 才能生成延迟网格</td></tr>
      </tbody></table>
    </div>
  </section>
</main>

<!-- Modal: 添加节点 -->
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <h3>添加新节点 <span class="close" onclick="closeModals()">&times;</span></h3>
    <div class="form-group">
      <label for="nodeNameInput">节点名称（例如：tokyo-01）</label>
      <input type="text" class="input" id="nodeNameInput" placeholder="输入节点名称…">
    </div>
    <button class="btn primary" style="width:100%" id="btnSubmitAdd">生成 Agent Token</button>
    <div id="addResult" style="display:none;margin-top:16px;">
      <label style="color:var(--green);font-weight:600">✓ Token 生成成功！请在目标节点执行命令：</label>
      <div class="code-block" id="cmdResult"></div>
      <div style="margin-top:8px;text-align:right">
        <button class="btn" id="btnCopyCmd">复制命令</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal: 节点管理 -->
<div class="modal-overlay" id="manageModal">
  <div class="modal">
    <h3>已注册节点管理 <span class="close" onclick="closeModals()">&times;</span></h3>
    <div style="max-height:300px;overflow-y:auto">
      <table class="token-table">
        <thead><tr><th>ID</th><th>名称</th><th>Token 密钥</th><th>操作</th></tr></thead>
        <tbody id="tokenTableBody"><tr><td colspan="4" class="empty">加载中…</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<footer>Larry 探针 · 开源服务器监控 · <a href="https://github.com/larry-probe/larry" target="_blank">GitHub</a></footer>
<script src="/static/app.js"></script>
</body>
</html>

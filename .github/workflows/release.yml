name: release

# 打 tag v*.*.* 时，交叉编译多平台二进制并发布到 GitHub Release。
# 产出的命名与 Makefile 的 `make cross` 一致：
#   bin/larry-agent-<os>-<arch>、bin/larry-server-<os>-<arch>
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  # 与仓库 go.mod 对齐
  GO_VERSION: '1.23'

jobs:
  build-matrix:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - linux/amd64
          - linux/arm64
          - linux/386
          - darwin/amd64
          - darwin/arm64
          - windows/amd64
          - windows/arm64
          - freebsd/amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build single binary set
        run: |
          os="${target%/*}"; arch="${target#*/}"
          mkdir -p out
          # 与 Makefile cross 一致的编译参数：CGO_ENABLED=0 静态，注入版本号
          VERSION="${{ github.ref_name }}"
          CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build \
            -ldflags "-s -w -X main.Version=$VERSION -X github.com/larry-probe/larry/internal/agent.Version=$VERSION" \
            -o "out/larry-agent-${os}-${arch}" ./cmd/larry-agent
          CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build \
            -ldflags "-s -w -X main.Version=$VERSION -X github.com/larry-probe/larry/internal/agent.Version=$VERSION" \
            -o "out/larry-server-${os}-${arch}" ./cmd/larry-server
        env:
          target: ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.target }}
          path: out/
          if-no-files-found: error

  release:
    name: Publish release
    needs: build-matrix
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts/

      # 生成 checksum，便于用户校验下载
      - name: Checksums
        run: |
          cd artifacts
          shasum -a 256 larry-* > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Larry 探针 ${{ github.ref_name }}
          draft: false
          prerelease: contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha')
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/larry-*
